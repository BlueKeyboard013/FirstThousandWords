services:
  # --- FastAPI backend -----------------------------------------------------
  - type: web
    name: first-thousand-words-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health

  # --- React / Vite static frontend -------------------------------------
  - type: web
    name: first-thousand-words-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this to the backend's URL once it is deployed, e.g.
      # https://first-thousand-words-api.onrender.com
      - key: VITE_API_BASE
        sync: false
